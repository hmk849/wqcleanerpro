name: WQCleanerPro
options:
  bundleIdPrefix: com.hmk849
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  WQCleanerPro:
    type: application
    platform: iOS
    sources:
      - path: Sources/WQCleanerPro
    info:
      path: Sources/WQCleanerPro/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hmk849.wqcleanerpro
        PRODUCT_NAME: "WQ Cleaner Pro"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    capabilities:
      - type: keychain-sharing
      - type: app-groups
        additionalProperties:
          groups:
            - "group.com.hmk849.wqcleanerpro"
